[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spikevpr"
version = "1.0.0"
description = "Spiking neural networks for event-based Visual Place Recognition (Brisbane, NSAVP, NYC)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "spikingjelly==0.0.0.0.15",
    "tonic>=1.4",
    "pytorch-metric-learning>=2.3",
    "scikit-learn>=1.3",
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "geopy>=2.4",
    "pynmea2>=1.19",
]

[project.optional-dependencies]
extras = ["matplotlib>=3.7", "tqdm>=4.65", "mlflow>=2.10"]
# Data-preparation tools (tools/): Brisbane slicing + NYC voxel-grid generation.
dataprep = ["pandas>=2.0", "scipy>=1.10", "utm>=0.7", "expelliarmus>=1.1", "pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["spikevpr*"]
